<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LOINC Code Validator</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-10">
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-xl font-bold mb-4 text-slate-800">LOINC Code Validator</h1>
        <form hx-post="/validate" hx-target="#result" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700">Enter LOINC Code:</label>
                <input type="text" name="code" placeholder="e.g., 6969-0"
                       class="mt-1 block w-full rounded-md border border-slate-300 p-2 shadow-sm
                              focus:border-indigo-500 focus:ring-indigo-500"
                       required>
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 text-white p-2 rounded-md hover:bg-indigo-700">
                Validate Code
            </button>
        </form>
        <div id="result" class="mt-4"></div>
    </div>
</body>
</html>
